name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Linux x86_64 tarball
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libxcomposite-dev \
            libxrender-dev \
            libxdamage-dev \
            libxfixes-dev \
            libcairo2-dev \
            libpango1.0-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package tarball
        run: |
          set -euo pipefail
          package="tobyscope-x11-linux-x86_64"
          mkdir -p "dist/${package}"
          cp target/release/tobyscope-x11 "dist/${package}/"
          cp README.md config.example.toml "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          (cd dist && sha256sum "${package}.tar.gz" > SHA256SUMS)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tobyscope-x11-linux-x86_64.tar.gz
            dist/SHA256SUMS
